name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [dependency-updated]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: meta_git_cli

      - name: Clone dependencies
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          for repo in meta_plugin_protocol meta_git_lib meta_cli meta_core loop_lib; do
            if git clone --depth 1 -b "$BRANCH" "https://github.com/gitkb/${repo}.git" 2>/dev/null; then
              echo "Cloned ${repo}@${BRANCH}"
            elif git clone --depth 1 "https://github.com/gitkb/${repo}.git"; then
              echo "Branch ${BRANCH} not found for ${repo}; falling back to default branch"
            else
              echo "::error::Failed to clone ${repo}"
              exit 1
            fi
          done

      - name: Create workspace root
        shell: bash
        run: |
          printf '[workspace]\nmembers = ["meta_git_cli"]\nresolver = "2"\n\n[workspace.package]\nversion = "0.0.0"\nedition = "2021"\nlicense = "MIT"\nrepository = "https://github.com/gitkb/meta"\n' > Cargo.toml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: meta_git_cli

      - name: Run tests
        working-directory: meta_git_cli
        run: cargo test --all-features

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: meta_git_cli

      - name: Clone dependencies
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          for repo in meta_plugin_protocol meta_git_lib meta_cli meta_core loop_lib; do
            if git clone --depth 1 -b "$BRANCH" "https://github.com/gitkb/${repo}.git" 2>/dev/null; then
              echo "Cloned ${repo}@${BRANCH}"
            elif git clone --depth 1 "https://github.com/gitkb/${repo}.git"; then
              echo "Branch ${BRANCH} not found for ${repo}; falling back to default branch"
            else
              echo "::error::Failed to clone ${repo}"
              exit 1
            fi
          done

      - name: Create workspace root
        run: |
          printf '[workspace]\nmembers = ["meta_git_cli"]\nresolver = "2"\n\n[workspace.package]\nversion = "0.0.0"\nedition = "2021"\nlicense = "MIT"\nrepository = "https://github.com/gitkb/meta"\n' > Cargo.toml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: meta_git_cli

      - name: Run clippy
        working-directory: meta_git_cli
        run: cargo clippy --all-targets --all-features -- -D warnings

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: |
          find src -name '*.rs' -exec rustfmt --check {} +
